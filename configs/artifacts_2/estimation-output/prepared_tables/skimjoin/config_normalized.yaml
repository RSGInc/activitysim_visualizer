skim_files:
- C:\Users\wesley.darling\project_data\new_odot_skims\Metro_skims\*.omx
- C:\Users\wesley.darling\project_data\odot_skims\maz_stop_walk.csv
- C:\Users\wesley.darling\project_data\odot_skims\maz_maz_walk.csv
activitysim:
  trips_table: null
  tours_table: null
  trip_mode_column: trip_mode
  tour_mode_column: tour_mode
  trip_id_column: trip_id
  tour_id_column: tour_id
  outbound_column: outbound
defaults:
  origin: OTAZ
  destination: DTAZ
  output_prefix: skim_
  missing_matrix_policy: error
  missing_od_policy: error
  sentinel_values:
  - 9999.0
  - 999999.0
zone_mapping:
  lookup_name: taz
  file_lookup_names:
    fares.omx: zone_number
  missing_zone_policy: error
ignore_modes:
- ESCOOTER
- EBIKE
- BIKE_TRANSIT
- MISSING
- OTHER
tour_aggregation:
  method: aggregate_trips
  aggregations: {}
  directional_outputs: {}
lookups:
- name: SOV.time
  mode: SOV
  component: time
  output: skim_auto_time
  matrix: SOV_{VOT}_TIME__{PERIOD}
  lookup: od
  key_column: null
  origin: OTAZ
  destination: DTAZ
  when: {}
  dimensions_used:
  - VOT
  - PERIOD
  dimensions:
    PERIOD:
      source_columns:
        trip_source_column: trip_period
        outbound_tour_source_column: start_period
        inbound_tour_source_column: first_inbound_trip_period
      resolved_source_column: trip_period
      values_from_network_los: false
      values: {}
    VOT:
      source_columns:
        trip_source_column: vot_bin
        outbound_tour_source_column: vot_bin
        inbound_tour_source_column: vot_bin
      resolved_source_column: vot_bin
      values_from_network_los: false
      values:
        L: L
        M: M
        H: H
  missing_matrix_policy: error
  missing_od_policy: error
  sentinel_values:
  - 9999.0
  - 999999.0
  combine_method: replace
  lookup_chain_id: SOV.time
  lookup_step_index: 0
  lookup_role: primary
  target_table: trips
