# ActivitySim Visualizer starter configuration
#
# Copy this file to local_config.yaml, then:
#   1. Replace the two run directories below.
#   2. Confirm the zone settings match your model.
#   3. Run: uv run activitysim-viz --config local_config.yaml
#
# Standard ActivitySim final_* CSV or Parquet files work without other changes.
# For other input types or advanced options, start at wiki/00-home.md.

name: ActivitySim Run Comparison
root: artifacts

# Summarize prepares raw inputs automatically when no valid prepared cache
# exists, then the dashboard opens at http://localhost:5006.
pipeline:
  steps: [summarize, dashboard]
  dashboard_mode: live
  overwrite: false

# These are the default ActivitySim file stems. Edit only names that differ in
# your model outputs; the visualizer accepts either .csv or .parquet files.
files:
  households: final_households
  persons: final_persons
  tours: final_tours
  trips: final_trips
  joint_tour_participants: final_joint_tour_participants
  land_use: final_land_use

# Required: replace these example directories. Add or remove runs as needed.
runs:
  - dir: C:\path\to\base\output
    label: Base
  - dir: C:\path\to\build\output
    label: Build

# Confirm these fields before the first run. For a TAZ-only model, keep
# use_maz false. For a MAZ/TAZ model, set it to true and name both columns.
zones:
  use_maz: false
  maz_col: zone_id
  taz_col: TAZ

summarize:
  weighting_modes: [weighted, unweighted]

dashboard:
  title: ActivitySim Run Comparison
