# ---------------------------------------------------------------------------
# Zone system
# Set use_maz: false for TAZ-only models (zone IDs in outputs are already TAZs).
# For 2-zone (MAZ+TAZ) models, specify which columns in final_land_use
# hold the MAZ and TAZ IDs.
# ---------------------------------------------------------------------------
zones:
  use_maz:  true         # false = TAZ-only model, no MAZ→TAZ conversion needed
  maz_col:  [MAZ, zone_id]      # column in final_land_use containing MAZ IDs
  taz_col:  TAZ           # column in final_land_use containing TAZ IDs


# ---------------------------------------------------------------------------
# Column names in the ActivitySim output files
# Change only if your outputs use non-standard column names.
# ---------------------------------------------------------------------------
columns:
  ptype:          ptype           # person type column in persons file
  hhsize:         hhsize          # HH size column in households file
  auto_ownership: auto_ownership  # vehicle count column in households file
  num_workers:    num_workers     # workers per HH in households file
  num_adults:     num_adults      # adults per HH in households file
  # income_segment: [income_segment, income_broad]  # OPTIONAL household income segment/level column for trip enrichment
  # Prefer a readable purpose column per run. Some survey-style outputs store
  # numeric codes in primary_purpose/tour_purpose and labels in tour_type.
  tour_purpose: [primary_purpose, tour_type, purpose]
  # sample_rate: sample_rate     # OPTIONAL override; if omitted, code auto-detects
                                 # a households column literally named 'sample_rate'.
                                 # finalweight = 1/sample_rate (unless explicit run weight columns are provided)
  # school_esc_outbound: [school_esc_outbound, out_escort_type]
  # school_esc_inbound: [school_esc_inbound, inb_escort_type]

prepare:
  output:
    file_format: parquet
  validation:
    relationship_checks: warn
  distance_skim:
    file: C:\Users\wesley.darling\project_data\new_odot_skims\Metro_skims\autoSkims__MD.omx       # path relative to run directory, or absolute
    matrix: SOV_H_DIST__MD
  non_motorized_distance_skim:
    file: C:\Users\wesley.darling\project_data\odot_skims\maz_maz_walk.csv
    matrix: null
  time_periods:
    network_los_file: C:\Users\wesley.darling\project_data\odot_skims\network_los.yaml
    trip_period_number_column: depart
    tour_start_period_number_column: start
    tour_end_period_number_column: end
  auto_sufficiency_basis: licensed_drivers # licensed_drivers | workers | adults
  vot_bins:
    source_column: income_segment
    output_column: vot_bin
    fallback_value: M
    mappings:
      unfiltered:
        1: L
        2: L
        3: M
        4: M
        5: H
        6: H
      new-filtered:
        1: L
        2: L
        3: M
        4: M
        5: H
        6: H
      new-override:
        1: L
        2: L
        3: M
        4: M
        5: H
        6: H
      new-estimation-output:
        1: L
        2: M
        3: M
        4: H

skimjoin:
  # Create optional long-form trip/tour tables with skim values for alternate modes.
  create_hypothetical_skim_tables: true
  defaults:
    config_path: will_skimjoin_config.yaml
    skim_files:
      - C:\Users\wesley.darling\project_data\new_odot_skims\Metro_skims\*.omx
      - C:\Users\wesley.darling\project_data\odot_skims\maz_stop_walk.csv
      - C:\Users\wesley.darling\project_data\odot_skims\maz_maz_walk.csv
    network_los_file: C:\Users\wesley.darling\project_data\odot_skims\network_los.yaml

segment:
  dashboard:
    segmentation_type: person_sex
    visibility: segments_only   # full_only | segments_only | full_and_segments
  definitions:
    signup_platform:
      include_full: true
      persist_segmented_prepared_tables: false
      allow_overlapping: false
      on_empty_segment: warn
      source:
        type: prepared_column 
        source_table: hh
        column: signup_platform
      segments:
        - id: rmove
          label: RMove
          values: ["rmove"]
        - id: browser
          label: Browser
          values: ["browser"]
        - id: call
          label: Call
          values: ["call"]

    person_sex:
      include_full: false
      persist_segmented_prepared_tables: false
      allow_overlapping: false
      on_empty_segment: warn
      source:
        type: prepared_column
        source_table: per
        column: SEX
      segments:
        - id: male
          label: Male
          values: [1]
        - id: female
          label: Female
          values: [2]

summarize:
  weighting_modes: [unweighted, weighted]
  pnr_tour_modes:
    - PNR_TRANSIT
  # OPTIONAL summary-time grouping for outputs with a tour_purpose dimension
  # group_joint_tour_purposes: true
  # group_atwork_tour_purposes: true
  # group_school_tour_purposes: true
  # Controls additional mapped geography aggregations only. Summaries may still
  # emit all_geographies totals, and native prepared home geographies such as
  # home_taz, home_county, and home_mpo can appear when those columns exist.
  geography:
    enabled: false
    # Configured mappings create columns such as home_geo__school_district,
    # work_geo__county, or land_use_geo__district.
    aggregations:
      school_district:
        source_zone_system: maz
        file: C:\Users\wesley.darling\Downloads\viz\viz\new_output\land_use.csv
        zone_id_col: zone_id
        geography_col: DIST_9to12

dashboard:
  title: "Estimation Mode Comparison Visualizer"
  enable_maz_geographies: false
  live:
    pages:
      - overview
      - long_term_choices
      - daily_travel
      - joint_travel
      - tour_summaries
      - trip_summaries
      - skim_summaries
      - validation:
        - traffic
        - transit
        - vmt
        - regional_validation
  export:
    output_path: exports/dashboard.html
    # summary series are baked into one exported HTML file.
    # `dashboard.export.pages` modifies matching live pages; it is not an
    # inclusion list. Omit selector overrides to export all widget states.
    # Export segmentation defaults to segmentation.dashboard when omitted.
    # Use full_only, segments_only, or full_and_segments to choose which
    dashboard:
      weighting: [unweighted]
      # segmentation_type: signup_platform
      # segmentation_visibility: segments_only
    pages:
      long_term_choices:
        mandatory_location_choice:
          geography_level:
            - All Geography Types
            - County
            - MPO
            # omit TAZ
      #     parts:
            # commuting_flows:
            #   enabled: false
            
        # shadow_pricing:
          # enabled: true
          # geography_level: [all]
          # student_type: [all]
          # parts:
          #   workplace_table:
          #     enabled: false
          #   school_table:
          #     enabled: false
      # tour_summaries:
      #   internal_external_tours:
      #     enabled: false
      validation:
        vmt:
          personal_auto_vmt_breakdown: all
          personal_auto_vmt_geography_type: all
          personal_auto_vmt_geography: default
          personal_auto_vmt_time_period: default
          personal_auto_vmt_mode: default
          personal_auto_vmt_income_segment: default
          personal_auto_vmt_household_size: default
          non_motorized_vmt_breakdown: all
          non_motorized_vmt_geography_type: all
          non_motorized_vmt_geography: default
          non_motorized_vmt_time_period: default
          non_motorized_vmt_mode: default
          non_motorized_vmt_income_segment: default
          non_motorized_vmt_household_size: default

          external_travel_metric: all
          external_travel_breakdown: all
          external_travel_trip_purpose: default
          external_travel_time_period: default

          demo_commercial_metric: all
          demo_commercial_breakdown: all
          demo_commercial_vehicle_type: default
          demo_commercial_time_period: default
  host:
    account: my-connect-cloud-account
    # app_id: 12345
    # title: Estimation Mode Comparison Visualizer
    # First hosted publish may open a browser for Posit Connect Cloud login.
    # Later runs usually reuse saved local rsconnect metadata.
    verify: true


