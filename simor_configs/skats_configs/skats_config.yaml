# ActivitySim Visualizer Configuration
# Adapt this file for each model deployment.
# Only the sections you need are required — see comments for which are optional.

name: "SKATS Settings"
root: ../../simor_project_outputs/skats_outputs # relative to the config's location 
log_level: INFO

pipeline:
  steps:
    - prepare
    - skimjoin
    # - segment
    - summarize # will automatically overwrite summaries with a stale cache
    - dashboard
  dashboard_mode: export # live | export | host 
  refresh: [] # list stages here only when a forced rebuild is required

# ---------------------------------------------------------------------------
# ActivitySim output file names
# Use stems (no extension) for automatic format detection: the reader will try
# .parquet first, then .csv.  You may also specify an explicit extension to
# force a particular format (e.g. final_households.csv or final_tours.parquet).
# ---------------------------------------------------------------------------
files:
  households:              household
  persons:                 person
  day:                     day
  tours:                   tour
  trips:                   trip_linked
  vehicles:                vehicles
  joint_tour_participants: joint_tour_participants
  land_use:                land_use

  

# Optional shared fallback files for optional inputs that may be missing in some
# run folders. These must be explicit .csv or .parquet paths.
fallback_files:
  land_use: C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_edb\final_land_use.csv

# ---------------------------------------------------------------------------
# Runs to compare
# Each entry specifies a run directory, a display label, and optional overrides.
#
# Weight columns (all optional — leave as null or omit to use default rules):
#   hh_weight_col:     explicit household weight column in final_households
#   person_weight_col: explicit person weight column in final_persons
#   trip_weight_col:   explicit trip weight column in final_trips
#                      (tour weight = average of its trips' weights when set)
#
# If none of the above are set and sample_rate is not in columns, all weights = 1.
# ---------------------------------------------------------------------------
runs:


  - dir:              C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\raw_statewide_survey
    label:            Raw Statewide Survey
    hh_weight_col:     hh_weight
    person_weight_col: person_weight
    trip_weight_col:   linked_trip_weight
    file_map:
      households:              toc_household
      persons:                 toc_person
      day:                     toc_day
      tours:                   toc_tour
      trips:                   toc_trip_linked
      joint_tour_participants: toc_joint_tour_participants
    skimjoin:
      config_path: skats_skimjoin_config_alternate_id_col.yaml

  - dir:              C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\survey_data
    label:            "Regional: Filtered & Attributed"
    hh_weight_col:     hh_weight
    person_weight_col: person_weight
    trip_weight_col:   linked_trip_weight
    skimjoin:
      config_path: skats_skimjoin_config_alternate_id_col.yaml

  - dir:              C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data
    label:            Estimation Mode Inputs
    hh_weight_col:     hh_weight
    person_weight_col: person_weight
    trip_weight_col:   linked_trip_weight
    file_map:
      households:              override_households
      persons:                 override_persons
      tours:                   override_tours
      trips:                   override_trips
      joint_tour_participants: override_joint_tour_participants

  - dir:              C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_edb
    label:            Estimation Mode Outputs
    hh_weight_col:     hh_weight
    person_weight_col: person_weight
    file_map:
      households:              final_households
      persons:                 final_persons
      tours:                   final_tours
      trips:                   final_trips
      vehicles:                final_vehicles
      joint_tour_participants: final_joint_tour_participants
      land_use:                final_land_use
  #   # skimjoin:
    #   config_path: will_skimjoin_config.yaml
    #   skim_files:
    #     - C:\Users\wesley.darling\project_data\odot_skims\*.omx
    #     - C:\Users\wesley.darling\project_data\odot_skims\maz_stop_walk.csv
    #     - C:\Users\wesley.darling\project_data\odot_skims\maz_maz_walk.csv
    #   network_los_file: C:\Users\wesley.darling\project_data\odot_skims\network_los.yaml


# ---------------------------------------------------------------------------
# Zone system
# Set use_maz: false for TAZ-only models (zone IDs in outputs are already TAZs).
# For 2-zone (MAZ+TAZ) models, specify which columns in final_land_use
# hold the MAZ and TAZ IDs.
# ---------------------------------------------------------------------------
zones:
  use_maz:  true         # false = TAZ-only model, no MAZ→TAZ conversion needed
  maz_col:  [MAZ, zone_id]      # column in final_land_use containing MAZ IDs
  taz_col:  TAZ           # column in final_land_use containing TAZ IDs


# ---------------------------------------------------------------------------
# Column names in the ActivitySim output files
# Change only if your outputs use non-standard column names.
# ---------------------------------------------------------------------------
columns:
  household_id:   [household_id, hh_id]
  trip_id:        [trip_id, linked_trip_id]
  trip_mode:      [trip_mode, linked_trip_mode]
  trip_num:       [trip_num, linked_trip_num]
  ptype:          ptype           # person type column in persons file
  hhsize:         hhsize          # HH size column in households file
  auto_ownership: auto_ownership  # vehicle count column in households file
  num_workers:    num_workers     # workers per HH in households file
  num_adults:     num_adults      # adults per HH in households file
  # income_segment: [income_segment, income_broad]  # OPTIONAL household income segment/level column for trip enrichment
  # Prefer a readable purpose column per run. Some survey-style outputs store
  # numeric codes in primary_purpose/tour_purpose and labels in tour_type.
  tour_purpose: [primary_purpose, tour_type, purpose]
  # sample_rate: sample_rate     # OPTIONAL override; if omitted, code auto-detects
                                 # a households column literally named 'sample_rate'.
                                 # finalweight = 1/sample_rate (unless explicit run weight columns are provided)
  # school_esc_outbound: [school_esc_outbound, out_escort_type]
  # school_esc_inbound: [school_esc_inbound, inb_escort_type]

prepare:
  category_mappings:
    raw_statewide_survey:
      persons:
        has_license:
          source: can_drive
          output_type: boolean
          preserve_unmapped: false
          mapping:
            1: true
            3: false
            995: false
      tours:
        tour_mode:
          mapping: &raw_statewide_tour_modes
            1: SCHOOLBUS
            2: WALK
            3: WALK_TRANSIT
            4: PNR_TRANSIT
            5: KNR_TRANSIT
            6: BIKE_TRANSIT
            7: BIKE
            8: EBIKE
            9: ESCOOTER
            10: TAXI
            11: TNC_SINGLE
            12: TNC_SHARED
            13: SOV
            14: HOV2
            15: HOV3
            16: OTHER
            995: MISSING
        tour_purpose:
          mapping:
            -1: othdiscr
            1: loop
            2: work
            3: othmaint
            4: school
            5: othmaint
            6: escort
            7: shopping
            8: eatout
            9: social
            10: othmaint
            12: othdiscr
            13: othdiscr
            14: loop
            995: null
        tour_category:
          mapping:
            1: mandatory
            2: non_mandatory
            3: atwork
            4: joint
      trips:
        trip_mode:
          source: linked_trip_mode
          mapping: *raw_statewide_tour_modes
        trip_purpose:
          source: d_purpose_category
          mapping:
            -1: othdiscr
            1: home
            2: work
            3: othmaint
            4: school
            5: othmaint
            6: escort
            7: shopping
            8: eatout
            9: social
            10: othmaint
            12: othdiscr
            13: othdiscr
            14: home
            995: null
  output:
    file_format: parquet
  validation:
    relationship_checks: warn
  distance_skim:
    file: C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\autoSkims__MD.omx       # path relative to run directory, or absolute
    matrix: SOV_H_DIST__MD
  non_motorized_distance_skim:
    file: C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\maz_maz_walk.csv
    matrix: null
  time_periods:
    network_los_file: C:\Users\wesley.darling\project_data\odot_skims\network_los.yaml
    trip_period_number_column: depart
    tour_start_period_number_column: start
    tour_end_period_number_column: end
  auto_sufficiency_basis: licensed_drivers # licensed_drivers | workers | adults
  vot_bins:
    source_column: income_segment
    output_column: vot_bin
    fallback_value: M
    mappings:
      raw_statewide_survey:
        1: L
        2: L
        3: M
        4: M
        5: H
        6: H
        995: M
        999: M
      survey:
        1: L
        2: L
        3: M
        4: M
        5: H
        6: H
        999: M
      override:
        1: L
        2: L
        3: M
        4: M
        5: H
        6: H
        999: M
      estimation:
        1: L
        2: L
        3: M
        4: M
        5: H
        6: H
        999: M

skimjoin:
  # Create optional long-form trip/tour tables with skim values for alternate modes.
  create_hypothetical_skim_tables: true
  defaults:
    config_path: skats_skimjoin_config.yaml
    skim_files:
      - 'C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\*.omx'
      - C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\maz_stop_walk.csv
      - C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\maz_maz_walk.csv
      - C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\bike_maz_logsums_commute.csv
      - C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\bike_maz_logsums_noncommute.csv
    network_los_file: C:\Users\wesley.darling\project_data\odot_skims\network_los.yaml

segment:
  dashboard:
    segmentation_type: person_sex
    visibility: segments_only   # full_only | segments_only | full_and_segments
  definitions:
    signup_platform:
      include_full: true
      persist_segmented_prepared_tables: false
      allow_overlapping: false
      on_empty_segment: warn
      source:
        type: prepared_column 
        source_table: hh
        column: signup_platform
      segments:
        - id: rmove
          label: RMove
          values: ["rmove"]
        - id: browser
          label: Browser
          values: ["browser"]
        - id: call
          label: Call
          values: ["call"]

    person_sex:
      include_full: false
      persist_segmented_prepared_tables: false
      allow_overlapping: false
      on_empty_segment: warn
      source:
        type: prepared_column
        source_table: per
        column: SEX
      segments:
        - id: male
          label: Male
          values: [1]
        - id: female
          label: Female
          values: [2]

summarize:
  weighting_modes: [unweighted, weighted]
  pnr_tour_modes:
    - PNR_TRANSIT
  # OPTIONAL summary-time grouping for outputs with a tour_purpose dimension
  # group_joint_tour_purposes: true
  # group_atwork_tour_purposes: true
  # group_school_tour_purposes: true
  # Controls additional mapped geography aggregations only. Summaries may still
  # emit all_geographies totals, and native prepared home geographies such as
  # home_taz, home_county, and home_mpo can appear when those columns exist.
  geography:
    enabled: true
    # Configured mappings create columns such as home_geo__school_district,
    # work_geo__county, or land_use_geo__district.
    aggregations:
      county:
        source_zone_system: maz
        file: C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\land_use.csv
        zone_id_col: MAZ
        geography_col: COUNTY
      city_code:
