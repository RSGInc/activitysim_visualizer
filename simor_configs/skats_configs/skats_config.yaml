dashboard:
  title: "SKATS Estimation Visualizer"
  logo: ../assets/skats_logo_white_bg.png
  enable_maz_geographies: false
  live:
    pages:
      - overview
      - long_term_choices
      - daily_travel
      - joint_travel
      - tour_summaries
      - trip_summaries
      - skim_summaries
      # - validation:
      #   - traffic
      #   - transit
      #   - vmt
      #   - regional_validation
  export:
    output_path: ../../simor_project_outputs/exports/skats_dashboard.html
    # summary series are baked into one exported HTML file.
    # `dashboard.export.pages` modifies matching live pages; it is not an
    # inclusion list. Omit selector overrides to export all widget states.
    # Export segmentation defaults to segmentation.dashboard when omitted.
    # Use full_only, segments_only, or full_and_segments to choose which
    dashboard:
      weighting: [unweighted]
      # segmentation_type: signup_platform
      # segmentation_visibility: segments_only
    pages:
      long_term_choices:
        mandatory_location_choice:
          geography_level:
            - All Geography Types
            - County
            - MPO
            # omit TAZ
      #     parts:
            # commuting_flows:
            #   enabled: false
            
        # shadow_pricing:
          # enabled: true
          # geography_level: [all]
          # student_type: [all]
          # parts:
          #   workplace_table:
          #     enabled: false
          #   school_table:
          #     enabled: false
      # tour_summaries:
      #   internal_external_tours:
      #     enabled: false
      validation:
        vmt:
          personal_auto_vmt_breakdown: all
          personal_auto_vmt_geography_type: all
          personal_auto_vmt_geography: default
          personal_auto_vmt_time_period: default
          personal_auto_vmt_mode: default
          personal_auto_vmt_income_segment: default
          personal_auto_vmt_household_size: default
          non_motorized_vmt_breakdown: all
          non_motorized_vmt_geography_type: all
          non_motorized_vmt_geography: default
          non_motorized_vmt_time_period: default
          non_motorized_vmt_mode: default
          non_motorized_vmt_income_segment: default
          non_motorized_vmt_household_size: default

          external_travel_metric: all
          external_travel_breakdown: all
          external_travel_trip_purpose: default
          external_travel_time_period: default

          demo_commercial_metric: all
          demo_commercial_breakdown: all
          demo_commercial_vehicle_type: default
          demo_commercial_time_period: default
  host:
    account: my-connect-cloud-account
    # app_id: 12345
    # title: Estimation Mode Comparison Visualizer
    # First hosted publish may open a browser for Posit Connect Cloud login.
    # Later runs usually reuse saved local rsconnect metadata.
    verify: true


