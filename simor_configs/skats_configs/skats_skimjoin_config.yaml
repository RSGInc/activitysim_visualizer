  skim_files:
    - 'C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\*.omx'
    - C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\maz_stop_walk.csv
    - C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\maz_maz_walk.csv
    - C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\bike_maz_logsums_commute.csv
    - C:\Users\wesley.darling\OneDrive - Resource Systems Group, Inc\odot_joint_estimation_data\skats_data\bike_maz_logsums_noncommute.csv
  network_los_file: C:\Users\wesley.darling\project_data\odot_skims\network_los.yaml
  # project.trips_table / project.tours_table / project.output_dir are used by the
  # standalone skimjoin CLI only. Integrated runtime skimjoin reads prepared
  # in-memory trips/tours from the processor pipeline instead.
  # trips_table: C:\Users\wesley.darling\Downloads\viz\viz\output\trip_linked.csv
  # trips_table: C:\Users\wesley.darling\projects\activitysim_visualizer\artifacts\prepared_cache\override\trips.parquet
  # tours_table: C:\Users\wesley.darling\Downloads\viz\viz\output\tour.csv
  # tours_table: C:\Users\wesley.darling\projects\activitysim_visualizer\artifacts\prepared_cache\override\tours.parquet
  # output_dir: skats_output
  

activitysim:
  # activitysim now only defines structural trip/tour fields used by skimjoin.
  trip_mode_column: trip_mode
  trip_id_column: trip_id
  tour_mode_column: tour_mode
  tour_id_column: tour_id
  outbound_column: outbound

defaults:
  origin: OTAZ
  destination: DTAZ
  output_prefix: skim_
  sentinel_values:
    - 9999
    - 999999

zone_mapping:
  lookup_name: taz
  file_lookup_names:
    fares.omx: taz
  missing_zone_policy: error

dimensions:
  PERIOD:
    source_columns:
      trip_source_column: trip_period
      outbound_tour_source_column: start_period
      inbound_tour_source_column: first_inbound_trip_period
  VOT:
    source_columns:
      trip_source_column: vot_bin
      outbound_tour_source_column: vot_bin
      inbound_tour_source_column: vot_bin
    values:
      L: L
      M: M
      H: H
  BIKE_PURPOSE:
    source_columns:
      trip_source_column: tour_purpose
      outbound_tour_source_column: tour_purpose
      inbound_tour_source_column: tour_purpose
    values:
      work: commute
      school: commute
      univ: commute
      atwork: noncommute
      business: noncommute
      eat: noncommute
      eatout: noncommute
      escort: noncommute
      loop: noncommute
      maint: noncommute
      othdiscr: noncommute
      othmaint: noncommute
      shopping: noncommute
      social: noncommute

ignore_modes:
  - ESCOOTER
  # SKATS has WTW skims only and no prepared drive-transit parking-zone field.
  - KNR_TRANSIT
  - MISSING
  - OTHER
  - PNR_TRANSIT

modes:
  SOV:
    output_prefix: skim_auto_
    time: "SOV_{VOT}_TIME__{PERIOD}"
    cost: "SOV_{VOT}_COST__{PERIOD}"
    distance: "SOV_{VOT}_DIST__{PERIOD}"
  HOV2:
    output_prefix: skim_auto_
    time: "SR2_{VOT}_TIME__{PERIOD}"
    cost: "SR2_{VOT}_COST__{PERIOD}"
    distance: "SR2_{VOT}_DIST__{PERIOD}"
  HOV3:
    output_prefix: skim_auto_
    time: "SR3_{VOT}_TIME__{PERIOD}"
    cost: "SR3_{VOT}_COST__{PERIOD}"
    distance: "SR3_{VOT}_DIST__{PERIOD}"
  SCHOOLBUS:
    output_prefix: skim_
    access_walk_time: 
      output: skim_walk_time
      combine: sum
      matrix: "WTW_ACC__{PERIOD}"
    transit_auxiliary_walk_time: "WTW_AUX__{PERIOD}"
    transit_bus_ivtt: "WTW_BUS__{PERIOD}"
    egress_walk_time: 
      output: skim_walk_time
      combine: sum
      matrix: "WTW_EGR__{PERIOD}"
    transit_first_wait_time: "WTW_FWT__{PERIOD}"
    transit_o_maz_stop_walk_bus:
      output: skim_transit_o_maz_stop_walk_bus
      lookup: key
      key_column: o_maz
      matrix: maz_stop_walk__walk_dist_local_bus
      fallbacks:
        - matrix: "WTW_ACC__{PERIOD}"
          origin: OTAZ
          destination: DTAZ
    transit_d_maz_stop_walk_bus:
      output: skim_transit_d_maz_stop_walk_bus
      lookup: key
      key_column: d_maz
      matrix: maz_stop_walk__walk_dist_local_bus
      fallbacks:
        - matrix: "WTW_EGR__{PERIOD}"
          origin: OTAZ
          destination: DTAZ
  TAXI:
    output_prefix: skim_auto_
    time: "SOV_{VOT}_TIME__{PERIOD}"
    cost: "SOV_{VOT}_COST__{PERIOD}"
    distance: "SOV_{VOT}_DIST__{PERIOD}" 
  TNC_SHARED:
    output_prefix: skim_auto_
    time: "SR2_{VOT}_TIME__{PERIOD}"
    cost: "SR2_{VOT}_COST__{PERIOD}"
    distance: "SR2_{VOT}_DIST__{PERIOD}"
  TNC_SINGLE:
    output_prefix: skim_auto_
    time: "SOV_{VOT}_TIME__{PERIOD}"
    cost: "SOV_{VOT}_COST__{PERIOD}"
    distance: "SOV_{VOT}_DIST__{PERIOD}"
  WALK:
    output_prefix: skim_walk_
    distance: WLK_DIST
    maz_walk_distance:
      output: skim_walk_maz_distance
      origin: o_maz
      destination: d_maz
      matrix: maz_maz_walk__DISTWALK
    maz_walk_actual:
      output: skim_walk_maz_actual
      origin: o_maz
      destination: d_maz
      matrix: maz_maz_walk__actual
  WALK_TRANSIT:
    output_prefix: skim_
    access_walk_time: 
      output: skim_walk_time
      combine: sum
      matrix: "WTW_ACC__{PERIOD}"
    transit_auxiliary_walk_time: "WTW_AUX__{PERIOD}"
    transit_brt_ivtt: "WTW_BRT__{PERIOD}"
    transit_bus_ivtt: "WTW_BUS__{PERIOD}"
    transit_commuter_rail_ivtt: "WTW_CRT__{PERIOD}"
    egress_walk_time: 
      output: skim_walk_time
      combine: sum
      matrix: "WTW_EGR__{PERIOD}"
    transit_first_wait_time: "WTW_FWT__{PERIOD}"
    transit_light_rail_ivtt: "WTW_LRT__{PERIOD}"
    transit_tiv: "WTW_TIV__{PERIOD}"
    transit_num_transfers: "WTW_XFR__{PERIOD}"
    transit_transfer_wait_time: "WTW_XWT__{PERIOD}"
    transit_fare: "fare__{PERIOD}"
    transit_o_maz_stop_walk_bus:
      output: skim_transit_o_maz_stop_walk_bus
      lookup: key
      key_column: o_maz
      matrix: maz_stop_walk__walk_dist_local_bus
    transit_d_maz_stop_walk_bus:
      output: skim_transit_d_maz_stop_walk_bus
      lookup: key
      key_column: d_maz
      matrix: maz_stop_walk__walk_dist_local_bus
    transit_o_maz_stop_walk_premium:
      output: skim_transit_o_maz_stop_walk_premium
      lookup: key
      key_column: o_maz
      matrix: maz_stop_walk__walk_dist_premium_transit
    transit_d_maz_stop_walk_premium:
      output: skim_transit_d_maz_stop_walk_premium
      lookup: key
      key_column: d_maz
      matrix: maz_stop_walk__walk_dist_premium_transit
  BIKE:
    output_prefix: skim_bike_
    maz_distance:
      output: skim_bike_maz_distance
      origin: o_maz
      destination: d_maz
      matrix: "bike_maz_logsums_{BIKE_PURPOSE}__distance_{BIKE_PURPOSE}"
    logsum:
      origin: o_maz
      destination: d_maz
      matrix: "bike_maz_logsums_{BIKE_PURPOSE}__logsum_{BIKE_PURPOSE}"
  EBIKE:
    output_prefix: skim_bike_
    maz_distance:
      output: skim_bike_maz_distance
      origin: o_maz
      destination: d_maz
      matrix: "bike_maz_logsums_{BIKE_PURPOSE}__distance_{BIKE_PURPOSE}"
  BIKE_TRANSIT:
    output_prefix: skim_
    bike_o_maz_stop_distance_bus:
      output: skim_bike_transit_distance_bus
      combine: sum
      lookup: key
      key_column: o_maz
      matrix: maz_stop_walk__walk_dist_local_bus
    bike_d_maz_stop_distance_bus:
      output: skim_bike_transit_distance_bus
      combine: sum
      lookup: key
      key_column: d_maz
      matrix: maz_stop_walk__walk_dist_local_bus
    bike_o_maz_stop_distance_premium:
      output: skim_bike_transit_distance_premium
      combine: sum
      lookup: key
      key_column: o_maz
      matrix: maz_stop_walk__walk_dist_premium_transit
    bike_d_maz_stop_distance_premium:
      output: skim_bike_transit_distance_premium
      combine: sum
      lookup: key
      key_column: d_maz
      matrix: maz_stop_walk__walk_dist_premium_transit
    transit_auxiliary_walk_time: "WTW_AUX__{PERIOD}"
    transit_brt_ivtt: "WTW_BRT__{PERIOD}"
    transit_bus_ivtt: "WTW_BUS__{PERIOD}"
    transit_commuter_rail_ivtt: "WTW_CRT__{PERIOD}"
    transit_first_wait_time: "WTW_FWT__{PERIOD}"
    transit_light_rail_ivtt: "WTW_LRT__{PERIOD}"
    transit_tiv: "WTW_TIV__{PERIOD}"
    transit_num_transfers: "WTW_XFR__{PERIOD}"
    transit_transfer_wait_time: "WTW_XWT__{PERIOD}"
    transit_fare: "fare__{PERIOD}"


