[project]
name = "activitysim-visualizer"
version = "0.1.0"
description = "Panel-based ActivitySim comparison visualizer"
requires-python = ">=3.10"
dependencies = [
    "h5py",
    "numpy",
    "pandas",
    "panel",
    "plotly",
    "polars",
    "pydantic",
    "pyarrow",
    "openmatrix",
    "pyyaml",
]

[project.scripts]
activitysim-viz = "run:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
notebooks = [
    "jupyter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "/dashboard",
    "/processor",
    "/runtime",
    "/run.py",
    "/config.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "full_export: exhaustive offline-export tests that render every default page and state",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
