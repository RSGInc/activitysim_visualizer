[project]
name = "activitysim-visualizer"
version = "0.1.0"
description = "Panel-based ActivitySim comparison visualizer"
requires-python = ">=3.10"
dependencies = [
    "h5py",
    "numpy",
    "jupyter",
    "pandas",
    "panel",
    "plotly",
    "polars",
    "pydantic",
    "pyarrow",
    "openmatrix",
    "pyyaml",
    "shiny",
    "shinywidgets",
]

[project.scripts]
activitysim-viz = "run:main"
activitysim-viz-freeze-panel = "quarto_visualizer.freeze_panel:main"
activitysim-viz-validate-parity = "quarto_visualizer.validate_parity:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
